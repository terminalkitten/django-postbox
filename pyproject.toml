[project]
name = "django-postbox"
dynamic = ["version"]
description = "Catch outgoing Django mail and read it in an inbox per recipient"
readme = "README.md"
authors = [{ name = "terminalkitten", email = "25918382+terminalkitten@users.noreply.github.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "django",
    "django-email",
    "email",
    "email-backend",
    "mail-catcher",
    "inbox",
    "htmx",
    "development-tools",
    "testing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = ["django>=5.2"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "ruff",
    "ty",
    "django-stubs",
    "tox",
    "tox-uv",
    "dokk[format,search,serve]>=0.0.4",
]

[project.urls]
Homepage = "https://github.com/terminalkitten/django-postbox"
Documentation = "https://terminalkitten.github.io/django-postbox/"
Source = "https://github.com/terminalkitten/django-postbox"
Issues = "https://github.com/terminalkitten/django-postbox/issues"
Changelog = "https://github.com/terminalkitten/django-postbox/releases"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from the git tag (v0.1.0 -> 0.1.0), there is nothing to bump
[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "no-guess-dev", fallback_version = "0.0.0" }

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/django_postbox"]

[tool.ty.src]
exclude = [".claude", ".skills"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".claude", ".skills", "src/django_postbox/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT", "ANN", "S", "PERF", "C4", "RUF", "DJ", "TC"]
ignore = ["E501", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "S105", "S106", "S311", "DJ008", "RUF012"]
"scripts/**" = ["S310", "S311", "S603"]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["error"]
addopts = """\
    --strict-config
    --strict-markers
    --ds=tests.project.settings
    --cov
    --cov-report=term-missing:skip-covered
    """
django_find_project = false

[tool.coverage.run]
source = ["django_postbox"]
omit = ["*/django_postbox/migrations/*"]

[tool.coverage.report]
fail_under = 90
